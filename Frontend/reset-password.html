<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Job Tracker</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Set a new password</h2>
      <p id="intro">Enter your new password to finish resetting your account.</p>
      <div class="input-box">
        <input type="email" id="email" name="email" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="password" name="password" placeholder="New password" required minlength="8">
      </div>
      <button id="resetButton">Reset password</button>
      <p class="error" id="status"></p>
      <div class="auth-links">
        <a href="login.html">Back to login</a>
      </div>
    </div>
  </div>
  <script>
    const API_URL = window.location.hostname.includes("localhost")
      ? "http://localhost:5000"
      : "https://job-backend-production-734e.up.railway.app";

    function getQueryParams() {
      return new URLSearchParams(window.location.search);
    }

    const params = getQueryParams();
    const token = params.get("token") || "";
    const email = params.get("email") || "";
    const status = document.getElementById("status");
    const emailField = document.getElementById("email");

    if (!token) {
      status.style.color = "yellow";
      status.textContent = "Missing reset token. Please use the link from your email.";
      document.getElementById("resetButton").disabled = true;
    }

    if (email) {
      emailField.value = email;
      emailField.readOnly = true;
    }

    document.getElementById("resetButton").addEventListener("click", async () => {
      const password = document.getElementById("password").value.trim();
      if (!emailField.value || !password) {
        status.style.color = "yellow";
        status.textContent = "Please enter your email and a new password.";
        return;
      }
      if (password.length < 8) {
        status.style.color = "yellow";
        status.textContent = "Password must be at least 8 characters.";
        return;
      }

      status.textContent = "";
      try {
        const res = await fetch(`${API_URL}/api/password-reset`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailField.value.trim(), token, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          status.style.color = "lightgreen";
          status.textContent = data.message || "Password reset successfully. Redirecting to login...";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 2200);
        } else {
          status.style.color = "yellow";
          status.textContent = data.message || "Could not reset password.";
        }
      } catch (err) {
        status.style.color = "yellow";
        status.textContent = "Unable to reach the server. Try again later.";
      }
    });
  </script>
</body>
</html>
