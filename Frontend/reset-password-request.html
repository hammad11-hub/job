<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Job Tracker</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Reset your password</h2>
      <p>Enter your email and we'll send a password reset link.</p>
      <div class="input-box">
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <button id="requestButton">Send reset link</button>
      <p class="error" id="status"></p>
      <div class="auth-links">
        <a href="login.html">Back to login</a>
      </div>
    </div>
  </div>
  <script>
    const API_URL = window.location.hostname.includes("localhost")
      ? "http://localhost:5000"
      : "https://job-backend-production-734e.up.railway.app";

    document.getElementById("requestButton").addEventListener("click", async () => {
      const status = document.getElementById("status");
      const email = document.getElementById("email").value.trim();
      if (!email) {
        status.style.color = "yellow";
        status.textContent = "Enter your email address.";
        return;
      }
      status.textContent = "";

      try {
        const res = await fetch(`${API_URL}/api/password-reset-request`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          status.style.color = "lightgreen";
          status.textContent = data.message || "Reset link sent if account exists.";
        } else {
          status.style.color = "yellow";
          status.textContent = data.message || "Could not send reset link.";
        }
      } catch (err) {
        status.style.color = "yellow";
        status.textContent = "Unable to reach the server. Try again later.";
      }
    });
  </script>
</body>
</html>
