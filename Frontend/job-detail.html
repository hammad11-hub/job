<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Detail | Job Tracker</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <nav class="nav">
    <div class="brand">Job Tracker</div>
    <div class="menu">
      <a href="home.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a class="btn alt" href="login.html">Login</a>
    </div>
  </nav>

  <main class="layout job-detail-page">
    <section class="job-detail-card" id="jobDetailCard">
      <div class="loading">Loading job...</div>
    </section>
  </main>

  <script>
    const API_URL = window.location.hostname.includes("localhost")
      ? "http://localhost:5000"
      : "https://job-backend-production-734e.up.railway.app";

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function formatSalary(salary) {
      if (!salary) return "Salary not listed";
      return `PKR ${salary.min.toLocaleString()} — PKR ${salary.max.toLocaleString()}`;
    }

    function createBadge(text) {
      return `<span class="badge">${text}</span>`;
    }

    async function loadJob() {
      const id = getQueryParam("id");
      const card = document.getElementById("jobDetailCard");
      if (!id) {
        card.innerHTML = "<p>Missing job identifier.</p>";
        return;
      }
      try {
        const res = await fetch(`${API_URL}/api/jobs/${encodeURIComponent(id)}`);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          card.innerHTML = `<p>${err.message || "Unable to load job."}</p>`;
          return;
        }
        const data = await res.json();
        const job = data.job;
        if (!job) {
          card.innerHTML = "<p>Job not found.</p>";
          return;
        }
        card.innerHTML = `
          <div class="job-detail-header">
            <div>
              <div class="badge badge-gold">${job.featured ? "Featured" : ""}</div>
              <h1>${job.title}</h1>
              <p class="job-meta">${job.company} · ${job.location} · ${job.type}</p>
            </div>
            <div class="job-actions">
              <a class="btn" href="jobs.html">Back to search</a>
            </div>
          </div>
          <div class="job-detail-body">
            <div class="job-detail-side">
              <div class="detail-block">
                <h3>Salary</h3>
                <p>${formatSalary(job.salary)}</p>
              </div>
              <div class="detail-block">
                <h3>Experience</h3>
                <p>${job.experienceLevel || "Not specified"}</p>
              </div>
              <div class="detail-block">
                <h3>Category</h3>
                <p>${job.category || "General"}</p>
              </div>
              <div class="detail-block">
                <h3>Skills</h3>
                <p>${Array.isArray(job.skills) ? job.skills.map((s) => `<span class="pill">${s}</span>`).join(" ") : "—"}</p>
              </div>
            </div>
            <div class="job-detail-main">
              <h2>Job description</h2>
              <p>${job.description || "No description available."}</p>
              <button class="btn" id="analyzeButton">Analyze My Fit</button>
            </div>
          </div>
        `;
      } catch (err) {
        card.innerHTML = `<p>Unable to load job. ${err.message}</p>`;
      }
    }

    loadJob();
  </script>
</body>
</html>
